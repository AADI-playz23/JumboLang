name: JumboLang Cross-Platform Release

# Triggered automatically when you push a tag like: v3.0.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── LINUX BUILD ──────────────────────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev

      - name: Build JumboLang (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: make USE_CURL=1

      # ── WINDOWS BUILD ─────────────────────────────────────────────────────────
      - name: Set up MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-pkgconf

      - name: Build JumboLang (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          g++ src/main.cpp src/Lexer.cpp src/Parser.cpp src/Interpreter.cpp \
              src/features/Network.cpp src/features/AI.cpp src/features/HTTP.cpp \
              src/features/FileSystem.cpp src/features/Database.cpp src/features/JSON.cpp \
              -o jumbol.exe -Iinclude -O2 -std=c++17 \
              -DHAVE_CURL -DCURL_STATICLIB \
              -static -static-libgcc -static-libstdc++ \
              $(pkg-config --static --libs libcurl)

      # ── UPLOAD ARTIFACTS ─────────────────────────────────────────────────────
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: |
            jumbol
            jumbol.exe

      # ── CREATE GITHUB RELEASE ────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            jumbol
            jumbol.exe
          fail_on_unmatched_files: false
          name: "JumboLang ${{ github.ref_name }}"
          body: |
            ## 🐘 JumboLang ${{ github.ref_name }}

            ### Quick Start
```bash
            # Set your API key
            export OPENAI_API_KEY="sk-..."

            # Run a script
            ./jumbol myapp.jl
```

            ### `{llm}` providers
